# Settings of the code checks (Black and pylint); see README.md.
[tool.black]
line-length = 80
target-version = ["py311"]

[tool.pylint.format]
max-line-length = 80
max-module-lines = 2000

# Procedural teaching workflows and generated task text are intentionally
# larger than typical library methods; keep pylint's other checks enabled.
[tool.pylint.design]
max-locals = 40
max-statements = 80
max-branches = 20
min-public-methods = 1

# Notebook 05 starts the Ollama server as a background process on purpose;
# a 'with' block would wait for the server to end.
[tool.pylint."messages control"]
disable = ["consider-using-with"]
