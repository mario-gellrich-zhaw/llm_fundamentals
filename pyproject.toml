[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-course"
version = "0.1.0"
description = "Helpers for Week 10 'Working with LLMs' (Module Data Science, ZHAW SML)"
requires-python = ">=3.11"
dependencies = ["openai>=3.49,<4", "python-dotenv>=1.0", "tqdm>=4.66", "presidio-analyzer>=2.2,<3", "spacy>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["black>=25,<27", "pylint>=3.3,<5"]

[tool.black]
line-length = 80
target-version = ["py311"]

[tool.pylint.format]
max-line-length = 80
max-module-lines = 2000

# Procedural teaching workflows and generated task text are intentionally
# larger than typical library methods; keep pylint's other checks enabled.
[tool.pylint.design]
max-locals = 40
max-statements = 80
max-branches = 20
min-public-methods = 1
